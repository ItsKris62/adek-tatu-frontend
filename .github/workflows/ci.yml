name: CI — Build Next.js Standalone

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build standalone artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Next.js (standalone)
        run: pnpm build

      - name: Assemble deployable package
        shell: bash
        run: |
          mkdir -p deploy-package
          cp -R .next/standalone/* deploy-package/
          mkdir -p deploy-package/.next/static
          cp -R .next/static/* deploy-package/.next/static/
          cp -R public deploy-package/public
          cp next.config.mjs deploy-package/next.config.mjs 2>/dev/null || true

          # Minimal production package.json for cPanel "Run NPM Install" button
          # (no devDeps, no scripts, engines hint — npm-only friendly)
          node -e "
            const pkg = require('./package.json');
            const out = {
              name: pkg.name,
              version: pkg.version,
              private: true,
              engines: { node: '>=18.18.0' },
              dependencies: pkg.dependencies || {}
            };
            require('fs').writeFileSync(
              'deploy-package/package.json',
              JSON.stringify(out, null, 2) + '\n'
            );
          "

      - name: Upload deploy artifact
        uses: actions/upload-artifact@v4
        with:
          name: adek-tatu-standalone
          path: deploy-package
          retention-days: 30
